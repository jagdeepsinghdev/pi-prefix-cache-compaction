# Publishes to npm when a version tag (v*) is pushed, or when run manually from the
# Actions tab (publishes the package.json version from the selected branch, then pushes
# the matching v<version> tag).
# Uses npm trusted publishing (OIDC): no NPM_TOKEN secret. The trusted publisher must be
# configured on npmjs.com for this repo with workflow file "publish.yml".
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # push the release tag on manual runs
  id-token: write # OIDC token for npm trusted publishing (also enables provenance)

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest

      - name: Check version tag
        id: ver
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$tag" != "$GITHUB_REF_NAME" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match package.json version $tag"
              exit 1
            fi
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::tag $tag already exists; bump package.json version first"
            exit 1
          fi

      - run: npm test

      - run: npm publish

      # A tag pushed with GITHUB_TOKEN does not trigger this workflow again.
      - name: Push release tag (manual runs)
        if: github.ref_type != 'tag'
        run: |
          git tag "${{ steps.ver.outputs.tag }}"
          git push origin "${{ steps.ver.outputs.tag }}"
